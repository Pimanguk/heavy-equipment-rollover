# 사이트에 필요한 파일(루트 이동 페이지 + web/)만 GitHub Pages로 배포한다.
# Blender·렌더·발표 자료 같은 큰 파일은 배포하지 않아 배포가 빠르다.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r web _site/web
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
